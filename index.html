<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis videos</title>
<style>
  body { margin: 0; padding: 16px; background: #14181f; color: #f2f4f8; font-family: "Trebuchet MS", Verdana, sans-serif; }
  h2 { font-size: 18px; margin: 18px 0 8px; }
  video { width: 100%; border-radius: 8px; background: #000; }
  #transmitir { display: block; width: 100%; margin-top: 26px; padding: 16px; border: 0; border-radius: 10px; background: #4cc2ff; color: #06222f; font-size: 20px; font-family: inherit; }
</style>
</head>
<body>
<div id="lista"></div>
<button id="transmitir" type="button">Transmitir</button>

<script>
  var VIDEOS = [
    { titulo: "Video 1", id: "1rTvUl3tgvG4wHl3zWieRCDC4mZkILFu5" },
    { titulo: "Video 2", id: "1i7keP_I_iKEb4OiUdXy_6S7Bl-krd8xB" }
  ];

  function directo(id) {
    return "https://drive.usercontent.google.com/download?id=" + id + "&export=download&confirm=t";
  }

  var actual = 0;
  var lista = document.getElementById("lista");

  VIDEOS.forEach(function (v, i) {
    var t = document.createElement("h2");
    t.textContent = v.titulo;
    var video = document.createElement("video");
    video.controls = true;
    video.setAttribute("playsinline", "");
    video.preload = "metadata";
    video.src = directo(v.id);
    video.addEventListener("play", function () { actual = i; });
    lista.appendChild(t);
    lista.appendChild(video);
  });

  // Abre el video elegido directamente en la app Web Video Caster
  document.getElementById("transmitir").onclick = function () {
    var url = directo(VIDEOS[actual].id).replace("https://", "");
    location.href = "intent://" + url +
      "#Intent;scheme=https;type=video/mp4;package=com.instantbits.cast.webvideo;end";
  };
</script>
</body>
</html>
